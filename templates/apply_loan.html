{% extends 'base.html' %}
{% block content %}
<h2>Apply Loan</h2>
<form method="post">
  <div class="mb-3"><label class="form-label">Category</label><input class="form-control" name="category"></div>
  <div class="mb-3"><label class="form-label">Amount</label><input class="form-control" name="amount" type="number" step="0.01"></div>
  <button type="submit" class="btn btn-success">Apply</button>
</form>
{% endblock %}
